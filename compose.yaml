# Runs from a fresh clone with `docker compose up --build`: no .env or manual steps needed.
# Values can be overridden from a .env file (see .env.example).

x-api-env: &api-env
  APP_KEY: ${APP_KEY:-}
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: http://localhost:8009
  DB_HOST: project-status-db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-laravel}
  DB_USERNAME: ${DB_USERNAME:-laravel}
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  KAFKA_BROKERS: project-status-kafka:29092
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3003,http://localhost:3005}

services:
  # Laravel API (default command of the image). Runs migrations on start.
  project-status-api:
    build:
      context: .
    image: project-status-api
    ports:
      - "8009:8009"
    environment: *api-env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8009/up"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10
    depends_on:
      project-status-db:
        condition: service_healthy
      project-status-kafka:
        condition: service_healthy

  # Same image, consumer command
  project-status-consumer:
    image: project-status-api
    pull_policy: never
    command: ["php", "artisan", "kafka:consume-projects"]
    environment: *api-env
    restart: unless-stopped
    depends_on:
      # The API runs the migrations, so wait until it is healthy
      project-status-api:
        condition: service_healthy
      project-status-kafka:
        condition: service_healthy

  project-status-sse:
    build:
      context: ./sse-hub
    ports:
      - "8010:8010"
    environment:
      PORT: 8010
      KAFKA_BROKERS: project-status-kafka:29092
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3003,http://localhost:3005}
    depends_on:
      project-status-kafka:
        condition: service_healthy

  project-status-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_DATABASE:-laravel}
    volumes:
      - project-status-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  project-status-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  project-status-kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - project-status-zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: project-status-zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://project-status-kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10

volumes:
  project-status-db-data:
